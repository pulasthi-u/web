<!doctype html>
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <script>window.MathJax = { tex: { tags: 'all' } };</script>
    <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js?config=TeX-AMS-MML_HTMLorMML">
        </script>

    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/blog.css">

    <title>Blog</title>
</head>

<svg style="display: none">
    <defs>
        <symbol id="arrowhead" viewBox="-1 1.5 12 12">
            <polyline points="0,5 5,10 10,5" stroke="#000" stroke-width="1.2" stroke-linecap="round"
                stroke-linejoin="round" fill="none" />
        </symbol>
        <symbol id="arrow" viewBox="-3 -3 16 16">
            <polyline points="5,0 10,5 0,5 10,5 5,10" stroke="#000" stroke-width="1.2" stroke-linecap="round"
                stroke-linejoin="round" fill="none" />
        </symbol>
    </defs>
</svg>

<body>
    <img src="images/bg.png" class="site-background">

    <header>
        <div class="name-logo">
            <div class="logo"></div>
            <h2 class="name">Pulasthi Udugamasooriya</h2>
        </div>

        <h1>My Blog</h1>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#blog">Blog</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div id="blog-content">
        <input type="text" id="search" placeholder="Find Article">

        <div id="article-list">
        </div>

        <div id="scroll">
            <svg class="arrow left" style="scale: 0.9">
                <use href="#arrow" />
            </svg>

            <span>
                Page 1 of 1
            </span>

            <svg class="arrow right" style="scale: 0.9">
                <use href="#arrow" />
            </svg>
        </div>
    </div>

    <footer>
        &copy; 2026 Pulasthi Udugamasooriya. All Rights Reserved.
    </footer>
</body>

<script type="module" src="scripts/blog.js"></script>

</html>
